<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="elevation" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <filter id="lid-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="finish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="left-white-clip"><path d="M229.74,345.6 A80,80 0 1 1 70.26,345.6 Z"/></clipPath>
    <clipPath id="left-eye-clip"><circle cx="150" cy="352" r="80"/></clipPath>
    <clipPath id="right-white-clip"><path d="M441.74,345.6 A80,80 0 1 1 282.26,345.6 Z"/></clipPath>
    <clipPath id="right-eye-clip"><circle cx="362" cy="352" r="80"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#3F51B5"/>
  <g id="rays" stroke="#FFC400" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="57" x2="256" y2="33"/>
    <line x1="177.1" y1="93.79" x2="158.71" y2="78.37"/>
    <line x1="334.9" y1="93.79" x2="353.29" y2="78.37"/>
  </g>
  <g id="third-eye" filter="url(#elevation)">
    <circle cx="256" cy="160" r="86" fill="#FAFAFA"/>
    <circle cx="256" cy="160" r="46.44" fill="#F50057"/>
    <circle cx="256" cy="160" r="24.15" fill="#1A237E"/>
    <circle cx="266.14" cy="149.86" r="8.69" fill="#FFFFFF"/>
    <circle cx="245.13" cy="171.59" r="3.62" fill="#FFFFFF"/>
  </g>
  <g id="left-eye" filter="url(#elevation)">
    <path d="M229.74,345.6 A80,80 0 1 1 70.26,345.6 Z" fill="#FAFAFA"/>
    <g clip-path="url(#left-white-clip)">
      <circle cx="174" cy="374.4" r="40" fill="#40C4FF"/>
      <circle cx="174" cy="374.4" r="20.8" fill="#1A237E"/>
      <circle cx="182.74" cy="365.66" r="7.49" fill="#FFFFFF"/>
      <circle cx="164.64" cy="384.38" r="3.12" fill="#FFFFFF"/>
      <path d="M70.26,345.6 A80,80 0 0 1 229.74,345.6 Z" fill="#000000" opacity="0.35" transform="translate(0,7)" filter="url(#lid-shadow)"/>
    </g>
    <path d="M70.26,345.6 A80,80 0 0 1 229.74,345.6 Z" fill="#283593"/>
    <path d="M70.26,345.6 L229.74,345.6" fill="none" stroke="#1A237E" stroke-width="7" stroke-linecap="round" clip-path="url(#left-eye-clip)"/>
  </g>
  <g id="right-eye" filter="url(#elevation)">
    <path d="M441.74,345.6 A80,80 0 1 1 282.26,345.6 Z" fill="#FAFAFA"/>
    <g clip-path="url(#right-white-clip)">
      <circle cx="386" cy="374.4" r="40" fill="#40C4FF"/>
      <circle cx="386" cy="374.4" r="20.8" fill="#1A237E"/>
      <circle cx="394.74" cy="365.66" r="7.49" fill="#FFFFFF"/>
      <circle cx="376.64" cy="384.38" r="3.12" fill="#FFFFFF"/>
      <path d="M282.26,345.6 A80,80 0 0 1 441.74,345.6 Z" fill="#000000" opacity="0.35" transform="translate(0,7)" filter="url(#lid-shadow)"/>
    </g>
    <path d="M282.26,345.6 A80,80 0 0 1 441.74,345.6 Z" fill="#283593"/>
    <path d="M282.26,345.6 L441.74,345.6" fill="none" stroke="#1A237E" stroke-width="7" stroke-linecap="round" clip-path="url(#right-eye-clip)"/>
