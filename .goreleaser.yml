version: 2

project_name: mitsume

before:
  hooks:
    - go mod tidy

builds:
  - id: mitsume
    binary: mitsume
    main: ./cmd/mitsume
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.FullCommit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: mitsume
    ids:
      - mitsume
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - docs/*.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: suecharo
    name: mitsume
  prerelease: auto
  draft: false

dockers:
  - id: mitsume-amd64
    ids:
      - mitsume
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/suecharo/mitsume:{{ .Version }}-amd64"
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.description=Single-binary uptime monitor with Slack notifications"
      - "--label=org.opencontainers.image.url=https://github.com/suecharo/mitsume"
      - "--label=org.opencontainers.image.source=https://github.com/suecharo/mitsume"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
  - id: mitsume-arm64
    ids:
      - mitsume
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/suecharo/mitsume:{{ .Version }}-arm64"
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.description=Single-binary uptime monitor with Slack notifications"
      - "--label=org.opencontainers.image.url=https://github.com/suecharo/mitsume"
      - "--label=org.opencontainers.image.source=https://github.com/suecharo/mitsume"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

docker_manifests:
  - name_template: "ghcr.io/suecharo/mitsume:{{ .Tag }}"
    image_templates:
      - "ghcr.io/suecharo/mitsume:{{ .Version }}-amd64"
      - "ghcr.io/suecharo/mitsume:{{ .Version }}-arm64"
  - name_template: "ghcr.io/suecharo/mitsume:v{{ .Major }}"
    image_templates:
      - "ghcr.io/suecharo/mitsume:{{ .Version }}-amd64"
      - "ghcr.io/suecharo/mitsume:{{ .Version }}-arm64"
    skip_push: 'auto'
  - name_template: "ghcr.io/suecharo/mitsume:latest"
    image_templates:
      - "ghcr.io/suecharo/mitsume:{{ .Version }}-amd64"
      - "ghcr.io/suecharo/mitsume:{{ .Version }}-arm64"
    skip_push: 'auto'
